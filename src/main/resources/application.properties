spring.application.name=gov-doc-ai
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=exaone3.5:2.4b
spring.ai.ollama.embedding.options.model=bge-m3
spring.ai.ollama.chat.options.num-predict=300
spring.ai.ollama.keep-alive=30m

spring.datasource.url=jdbc:postgresql://localhost:5432/govdocai
spring.datasource.username=govdocai
spring.datasource.password=govdocai

spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=1024
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE